# Netlify 部署配置
# 推送到 GitHub 后，在 Netlify 控制台 "Import from Git" 选这个仓库即可自动识别本配置

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 缓存静态资源
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA-like 路由兜底（Astro 默认生成静态文件，本规则只是防御性兜底）
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
